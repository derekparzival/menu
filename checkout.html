<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Food Order</title>
    <link rel="stylesheet" href="checkout.css">
</head>
<body>
    <div class="checkout-container">
        <header class="checkout-header">
            <h2>Checkout</h2>
        </header>

        <div class="checkout-content">
            <!-- Billing Form -->
            <section class="billing-section">
                <h3>Billing Details</h3>
                <form action="#" method="POST">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" required placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required placeholder="john@example.com">
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="text" id="password" name="password" required placeholder="johndoe6767">
                    </div>
                    <div class="form-group">
                        <label for="address">Delivery Address</label>
                        <textarea id="address" name="address" rows="3" required placeholder="123 Main St, City"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="payment">Payment Method</label>
                        <select id="payment" name="payment">
                            <option value="card">Credit/Debit Card</option>
                            <option value="transfer">Bank Transfer</option>
                            <option value="cash">Cash on Delivery</option>
                        </select>
                    </div>
                </form>
            </section>

            <!-- Order Summary -->
            <section class="summary-section">
                <h3>Order Summary</h3>
                <ul class="order-list">
                    <li><span>Jollof Rice & Stew</span> <span>#1000</span></li>
                    <li><span>Fried Yam</span> <span>#500</span></li>
                </ul>
                <div class="total-row">
                    <strong>Total:</strong>
                    <strong>#1500</strong>
                </div>
               <a href="confirm.html"><button type="submit" class="place-order-btn">Place Order</button></a>
            </section>
        </div>
    </div>
</body>
</html>
